# Build the port and run the tests that need no game files.
#
# The tests that ctest runs work without the game files: test_2d skips
# its data tests when ASCENT_DATA_DIR has no font files. test_dtudata and
# tools/uitest.py need the game files and are not run here.
#
# Both systems build the libraries, the tests, the game (target ascent)
# and ascent-import. Linux builds with GCC and with Clang. ascent-content
# and the setup program are for Windows only. The GCC job of Linux also
# builds the Linux release tarball and keeps it as a build artifact.
#
# The Linux jobs use Ubuntu 22.04, not the newest release: the glibc of
# the build system is the oldest glibc that the tarball runs on. The job
# linux-old builds with the tools of Ubuntu 20.04 (CMake 3.16, GCC 9), the
# oldest tools that the build supports (docs/install.md).
name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-sdl3
      - name: Configure
        run: cmake --preset debug
      - name: Build
        run: |
          cmake --build --preset debug
          cmake --build --preset debug --target ascent
      - name: Test
        run: ctest --preset debug

  linux:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        cc: [ gcc, clang ]
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install packages
        # The build dependencies of SDL3 (README-linux.md of SDL). The
        # configure step of SDL3 stops when the X11 extension XTest
        # (libxtst-dev) is missing.
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev \
            libxi-dev libxss-dev libxtst-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols libdecor-0-dev \
            libegl1-mesa-dev libgl1-mesa-dev libdrm-dev libgbm-dev \
            libasound2-dev libpulse-dev libpipewire-0.3-dev libdbus-1-dev libudev-dev
      - name: Configure
        # Ubuntu has no SDL3 package: the configure step downloads and
        # builds SDL3 (CMakeLists.txt).
        run: cmake --preset debug
      - name: Build
        run: |
          cmake --build --preset debug
          cmake --build --preset debug --target ascent
      - name: Test
        run: ctest --preset debug
      # The Linux release tarball (installer/build-linux.sh, docs/install.md):
      # a build artifact of the GCC job, not a release.
      - name: Check setup.sh
        if: matrix.cc == 'gcc'
        run: shellcheck -s sh installer/linux/setup.sh installer/build-linux.sh
      - name: Release tarball
        if: matrix.cc == 'gcc'
        run: sh installer/build-linux.sh
      - name: Keep the tarball
        if: matrix.cc == 'gcc'
        uses: actions/upload-artifact@v4
        with:
          name: ascent-dtu-linux-x86_64
          path: build-rel-linux/ascent-dtu-*-linux-x86_64.tar.gz
          if-no-files-found: error

  # The oldest supported tools. CMake 3.16 has no presets, and Ubuntu
  # 20.04 has no libdecor and no PipeWire 0.3 package: SDL3 builds
  # without them.
  linux-old:
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build git ca-certificates pkg-config python3 \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev \
            libxi-dev libxss-dev libxtst-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols \
            libegl1-mesa-dev libgl1-mesa-dev libdrm-dev libgbm-dev \
            libasound2-dev libpulse-dev libdbus-1-dev libudev-dev
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cmake -S . -B build-debug -G Ninja -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: |
          cmake --build build-debug
          cmake --build build-debug --target ascent
      - name: Test
        run: cd build-debug && ctest --output-on-failure
