# Build the port and run the tests that need no game files.
#
# The tests that ctest runs work without the game files: test_2d skips
# its data tests when ASCENT_DATA_DIR has no font files. test_dtudata and
# tools/uitest.py need the game files and are not run here.
#
# Both systems build the libraries, the tests, the game (target ascent)
# and ascent-import. Linux builds with GCC and with Clang. ascent-content
# and the setup program are for Windows only.
name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-sdl3
      - name: Configure
        run: cmake --preset debug
      - name: Build
        run: |
          cmake --build --preset debug
          cmake --build --preset debug --target ascent
      - name: Test
        run: ctest --preset debug

  linux:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cc: [ gcc, clang ]
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install packages
        # The build dependencies of SDL3 (README-linux.md of SDL). The
        # configure step of SDL3 stops when the X11 extension XTest
        # (libxtst-dev) is missing.
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev \
            libxi-dev libxss-dev libxtst-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols libdecor-0-dev \
            libegl1-mesa-dev libgl1-mesa-dev libdrm-dev libgbm-dev \
            libasound2-dev libpulse-dev libpipewire-0.3-dev libdbus-1-dev libudev-dev
      - name: Configure
        # Ubuntu has no SDL3 package: the configure step downloads and
        # builds SDL3 (CMakeLists.txt).
        run: cmake --preset debug
      - name: Build
        run: |
          cmake --build --preset debug
          cmake --build --preset debug --target ascent
      - name: Test
        run: ctest --preset debug
