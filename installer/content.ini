; ASCENT: the server of the downloadable content (docs/install.md).
;
; This is the one place in the repository with the address. The setup
; script (ascent.iss) reads it when it is compiled, and the setup program
; writes the address it used to content.ini in the installed folder, where
; ascent-content reads it. A test can give another address: the setup
; option /CONTENTURL=..., or the option --url of ascent-content.
;
; base_url is the folder of manifest.txt and the packs, with "/" at the
; end. It is empty here: the owner sets it for a release build.
;
; The client sends the header and the User-Agent below. The server uses
; them to refuse other clients. It is a deterrent, not a protection.
[content]
base_url=
client_header=X-Ascent-Client
client_token=ascent-setup-1
user_agent=ASCENT-Setup/1.0
